[project]
name = "samuel-realtime-parrot"
version = "0.1.0"
description = "Real-time phrase-by-phrase parroting pipeline using vvolhejn/samuel + Pink Trombone vocal tract simulator. Windows (VB-CABLE) primary, Linux (PipeWire Null-Sink) dev."
readme = "README.md"
authors = [
    { name = "lydorianP", email = "277419538+lydorianP@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "huggingface-hub>=1.29.0",
    "librosa>=1.0.0",
    "numpy>=2.5.2",
    "onnx>=1.22.0",
    "onnxruntime>=1.29.0",
    "onnxscript>=0.7.1",
    "pydantic>=2.0",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "soxr>=0.5.0",
]
optional-dependencies = {
    "windows-onnx" = ["onnxruntime-directml>=1.20.0"],
    "training" = [
        "hydra-core>=1.3.6",
        "omegaconf>=2.3.1",
        "wandb>=0.29.0",
        "transformers>=5.16.0",
        "faster-whisper>=1.2.0",
        "jiwer>=4.0.0",
        "plotly>=7.0.0",
        "tqdm>=4.66.0",
    ],
}

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
